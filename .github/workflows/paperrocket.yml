name: paperrocket-sign

# Our own CI. Upstream workflows only run on main, which this fork does not build from.
# Base branch: paperrocket. Release tags: v<upstream>-pr.<n>, e.g. v2.21.1-pr.1.

on:
  pull_request:
    branches: ['paperrocket']
  push:
    branches: ['paperrocket']
    tags: ['v*-pr.*']
  workflow_dispatch:

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

concurrency:
  group: paperrocket-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-install
      - name: Copy env
        run: cp .env.example .env
      - name: Build app
        run: npm run build
      - name: Render email and certificate snapshots
        if: hashFiles('scripts/paperrocket/render-snapshots.ts') != ''
        run: npx tsx scripts/paperrocket/render-snapshots.ts out/snapshots
      - name: Upload snapshots
        if: hashFiles('scripts/paperrocket/render-snapshots.ts') != ''
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: out/snapshots

  image:
    name: Publish image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ghcr.io/daniel-paperrocket/paperrocket-sign:${{ github.ref_name }}
