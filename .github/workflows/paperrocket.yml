name: paperrocket-sign

# Our own CI. Upstream workflows only run on main, which this fork does not build from.
# Base branch: paperrocket. Release tags: v<upstream>-pr.<n>, e.g. v2.21.1-pr.1.

on:
  pull_request:
    branches: ['paperrocket', 'pr/**']
  push:
    branches: ['paperrocket']
    tags: ['v*-pr.*']
  workflow_dispatch:

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

concurrency:
  group: paperrocket-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: No client names, hosts or server paths in the public repo
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "$BASE_REF"
            bash scripts/paperrocket/check-no-infra.sh "origin/$BASE_REF"
          else
            bash scripts/paperrocket/check-no-infra.sh
          fi
      - uses: ./.github/actions/node-install
      - name: Copy env
        run: cp .env.example .env
      - name: Type-check
        run: npm run typecheck -w @documenso/remix
      - name: Unit tests (zoned time formatting)
        if: hashFiles('packages/lib/server-only/pdf/format-zoned-time.test.ts') != ''
        run: npm run test -w @documenso/lib -- server-only/pdf/format-zoned-time.test.ts
      - name: Build app
        run: npm run build
      - name: Render email and certificate snapshots
        if: hashFiles('scripts/paperrocket/render-snapshots.ts') != ''
        run: npx vite-node --config scripts/paperrocket/vite.config.ts scripts/paperrocket/render-snapshots.ts out/snapshots
      - name: Upload snapshots
        if: hashFiles('scripts/paperrocket/render-snapshots.ts') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshots
          path: out/snapshots

  image:
    name: Publish image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ghcr.io/daniel-paperrocket/paperrocket-sign:${{ github.ref_name }}
